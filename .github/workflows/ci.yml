name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:
    inputs:
      skip_native:
        description: Recovery refreshes advisories without rebuilding frozen assets
        type: boolean
        default: false
      skip_hosted:
        description: Release runs hosted acceptance against frozen candidate bytes instead
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    - cron: '13 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    if: github.event_name != 'schedule' && !inputs.skip_native
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
          - runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-${{ matrix.target }}
      CARGO_BUILD_WARNINGS: deny
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned native Rust
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component clippy --component rustfmt --component rust-docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: ./scripts/check.ps1 -Check format -ExpectedHost '${{ matrix.target }}'
      - name: Clippy
        run: ./scripts/check.ps1 -Check lint -ExpectedHost '${{ matrix.target }}'
      - name: Tests
        run: |
          $env:REGQRY_TEST_PWSH = Join-Path $PSHOME 'pwsh.exe'
          ./scripts/check.ps1 -Check test -ExpectedHost '${{ matrix.target }}'
      - name: Package and independent source installation
        run: ./scripts/check.ps1 -Check package -ExpectedHost '${{ matrix.target }}'
      - name: Release state and evidence rejection model (no external writes)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: ./scripts/test-release-gates.ps1 -ReportDirectory artifacts/release-gates
      - name: Install pinned license collector
        run: |
          $version = (Import-PowerShellDataFile ./scripts/tools.psd1).CargoAbout
          $toolRoot = Join-Path $env:RUNNER_TEMP 'regqry-license-tools'
          cargo install --version $version --locked --features cli --root $toolRoot cargo-about
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installedVersion = & (Join-Path $toolRoot 'bin/cargo-about.exe') --version
          if ($LASTEXITCODE -ne 0 -or $installedVersion -cne ('cargo-about ' + $version)) { throw 'Pinned cargo-about installation failed' }
          (Join-Path $toolRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build and relocate native user and test assets
        run: |
          $env:REGQRY_TEST_PWSH = Join-Path $PSHOME 'pwsh.exe'
          $metadataText = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $metadata = $metadataText | ConvertFrom-Json
          $package = @($metadata.packages | Where-Object name -eq 'regqry')[0]
          $source = Join-Path $metadata.target_directory ('package/regqry-' + $package.version + '.crate')
          ./scripts/build-release-assets.ps1 -SourceArchive $source -OutputDirectory artifacts/native-assets -Target '${{ matrix.target }}'
          $assets = Get-Content artifacts/native-assets/build.json -Raw -Encoding utf8 | ConvertFrom-Json
          ./scripts/check-release-assets.ps1 -BuildReport artifacts/native-assets/build.json -ReportDirectory artifacts/native-asset-check -PowerShell7 (Join-Path $PSHOME 'pwsh.exe')
          ./scripts/test-release-asset-gates.ps1 -BuildReport artifacts/native-assets/build.json -ReportDirectory artifacts/native-asset-gates
          ./scripts/test-bundle-gates.ps1 -BundleDirectory $assets.tests.directory -BundleArchive $assets.tests.archive -ReportDirectory artifacts/portable-test-gates
          ./scripts/test-vm-gates.ps1 -BundleDirectory $assets.tests.directory -ReportDirectory artifacts/vm-test-gates
          ./scripts/test-performance-gates.ps1 -BundleDirectory $assets.tests.directory -ReportDirectory artifacts/performance-test-gates
      - name: Preserve package-check records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-check-${{ matrix.target }}
          path: artifacts/package-check/**/result.json
          if-no-files-found: warn
      - name: Preserve native assets and development check records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-assets-${{ matrix.target }}
          path: |
            artifacts/native-assets/*.zip
            artifacts/native-assets/*.crate
            artifacts/native-assets/build.json
            artifacts/native-assets/user-license-report/**
            artifacts/native-assets/tests/*.zip
            artifacts/native-assets/tests/build.json
            artifacts/native-assets/tests/*.jsonl
            artifacts/native-assets/tests/test-license-report/**
            artifacts/native-asset-check/**
            artifacts/native-asset-gates/**
            artifacts/portable-test-gates/**
            artifacts/vm-test-gates/**
            artifacts/performance-test-gates/**
            artifacts/release-gates/**
          if-no-files-found: warn

  hosted-registry:
    needs: native
    if: github.event_name != 'schedule' && !inputs.skip_native && !inputs.skip_hosted
    name: Ordinary-user registry ${{ matrix.target }}
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
          - runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-assets-${{ matrix.target }}
          path: artifacts/inputs
          digest-mismatch: error
      - name: Install pinned native source-installation compiler
        run: |
          rustup toolchain install '1.100.0-${{ matrix.target }}' --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare as administrator and query as a fresh ordinary user
        env:
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: ./scripts/check-hosted-registry.ps1 -GitHubHostedVm -InputDirectory artifacts/inputs/native-assets -ReportDirectory artifacts/hosted-registry -PowerShell7 (Join-Path $PSHOME 'pwsh.exe')
      - name: Preserve actual roles, fixtures and results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-registry-${{ matrix.target }}
          path: artifacts/hosted-registry/**
          if-no-files-found: warn

  dependencies:
    runs-on: windows-2025-vs2026
    env:
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install dependency checker
        run: |
          $version = (Import-PowerShellDataFile ./scripts/tools.psd1).CargoDeny
          $toolRoot = Join-Path $env:RUNNER_TEMP 'regqry-tools'
          cargo install --version $version --locked --root $toolRoot cargo-deny
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $toolRoot 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Fetch and check using a fresh cache
        run: ./scripts/check-dependencies.ps1 -CacheParent $env:RUNNER_TEMP
      - name: Preserve dependency-check records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check
          path: artifacts/dependencies/result.json
          if-no-files-found: warn

  unsupported-platform:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Verify the product rejects non-Windows targets
        shell: bash
        run: |
          set +e
          cargo check --locked --bin regqry >unsupported.log 2>&1
          status=$?
          set -e
          cat unsupported.log
          if [ "$status" -eq 0 ]; then
            echo 'Non-Windows compilation unexpectedly succeeded'
            exit 1
          fi
          grep -F -- 'RegQry supports Windows only.' unsupported.log
