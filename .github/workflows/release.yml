name: Release draft readback diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  draft-readback:
    runs-on: ubuntu-24.04
    steps:
      - name: Observe existing draft through list, ID, tag, CLI and GraphQL
        shell: bash
        run: |
          mkdir proof
          gh api "repos/$GITHUB_REPOSITORY" --jq '{id,full_name,permissions}' > proof/repository.json
          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[]|{id,tag_name,draft}]' > proof/list.json 2> proof/list.stderr.txt
          printf '%s\n' "$?" > proof/list.exit.txt
          gh api "repos/$GITHUB_REPOSITORY/releases/451946069" --jq '{id,tag_name,draft}' > proof/id.json 2> proof/id.stderr.txt
          printf '%s\n' "$?" > proof/id.exit.txt
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.1.1" --jq '{id,tag_name,draft}' > proof/tag.json 2> proof/tag.stderr.txt
          printf '%s\n' "$?" > proof/tag.exit.txt
          gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" --json id,isDraft,tagName > proof/cli.json 2> proof/cli.stderr.txt
          printf '%s\n' "$?" > proof/cli.exit.txt
          gh api graphql -f 'query=query {repository(owner:"inaku-Gyan",name:"RegQry"){release(tagName:"v0.1.1"){databaseId tagName isDraft}}}' > proof/graphql.json 2> proof/graphql.stderr.txt
          printf '%s\n' "$?" > proof/graphql.exit.txt
          set -e
          for route in list id tag cli graphql; do
            printf '\n%s: exit ' "$route"
            cat "proof/$route.exit.txt" "proof/$route.json" "proof/$route.stderr.txt"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: draft-readback
          path: proof/**
          if-no-files-found: error
