name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      evidence_url:
        description: HTTPS URL of preserved acceptance ZIP (data only; existing tag recovery)
        type: string
        required: false
      evidence_sha256:
        description: SHA-256 of that exact acceptance ZIP
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  CARGO_TERM_COLOR: never
  CARGO_BUILD_WARNINGS: deny
  RUSTUP_TOOLCHAIN: 1.100.0
  RELEASE_EVIDENCE_URL: ${{ inputs.evidence_url || vars.RELEASE_EVIDENCE_URL }}
  RELEASE_EVIDENCE_SHA256: ${{ inputs.evidence_sha256 || vars.RELEASE_EVIDENCE_SHA256 }}

defaults:
  run:
    shell: pwsh

jobs:
  inspect:
    runs-on: windows-2025-vs2026
    # Draft listing requires push visibility. This job only observes state; a
    # filtered read-only listing must never be mistaken for absence of a draft.
    permissions:
      contents: write
    outputs:
      state: ${{ steps.inspect.outputs.state }}
      version: ${{ steps.inspect.outputs.version }}
      commit: ${{ steps.inspect.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install fixed Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Inspect actual tag and remote candidate before any build
        id: inspect
        run: ./scripts/release.ps1 -Action Inspect -Tag $env:RELEASE_TAG -OutputDirectory artifacts/release-inspect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-inspect
          path: artifacts/release-inspect/result.json
          if-no-files-found: warn

  quality:
    needs: inspect
    uses: ./.github/workflows/ci.yml
    with:
      skip_native: ${{ needs.inspect.outputs.state != 'fresh' }}

  source:
    needs: [inspect, quality]
    if: needs.inspect.outputs.state == 'fresh'
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install fixed Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve one verified x64 Cargo archive for both native builds
        run: ./scripts/release.ps1 -Action Source -Tag $env:RELEASE_TAG -OutputDirectory artifacts/release-source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-source
          path: artifacts/release-source/*.crate
          if-no-files-found: error

  native:
    needs: [inspect, source]
    if: needs.inspect.outputs.state == 'fresh'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
          - runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-${{ matrix.target }}
      RELEASE_TARGET: ${{ matrix.target }}
      RELEASE_VERSION: ${{ needs.inspect.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-source
          path: artifacts/source
          digest-mismatch: error
      - name: Install native compiler, documentation and license collector
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rust-docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $toolRoot = Join-Path $env:RUNNER_TEMP 'regqry-license-tools'
          cargo install --version 0.9.3 --locked --root $toolRoot cargo-about
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $toolRoot 'bin') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build exact user/test assets with recorded MSVC and SDK
        run: |
          $source = 'artifacts/source/regqry-' + $env:RELEASE_VERSION + '.crate'
          ./scripts/build-release-candidate.ps1 -SourceArchive $source -OutputDirectory artifacts/candidate -Target $env:RELEASE_TARGET
          ./scripts/check-release-assets.ps1 -BuildReport artifacts/candidate/build.json -ReportDirectory artifacts/candidate/check -PowerShell7 (Join-Path $PSHOME 'pwsh.exe')
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.target }}
          path: |
            artifacts/candidate/*.crate
            artifacts/candidate/*.zip
            artifacts/candidate/build.json
            artifacts/candidate/tests/*.zip
            artifacts/candidate/tests/build.json
            artifacts/candidate/tests/*.jsonl
            artifacts/candidate/tests/test-license-report/**
            artifacts/candidate/user-license-report/**
            artifacts/candidate/check/**
          if-no-files-found: error

  freeze:
    needs: [inspect, native]
    if: needs.inspect.outputs.state == 'fresh'
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-x86_64-pc-windows-msvc
          path: artifacts/candidates/x86_64-pc-windows-msvc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-aarch64-pc-windows-msvc
          path: artifacts/candidates/aarch64-pc-windows-msvc
      - name: Install fixed Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Freeze the draft using original uploaded/downloaded byte identities
        run: ./scripts/release.ps1 -Action Freeze -Tag $env:RELEASE_TAG -InputDirectory artifacts/candidates -OutputDirectory artifacts/release-freeze
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-freeze
          path: artifacts/release-freeze/**
          if-no-files-found: warn

  cargo:
    needs: [inspect, quality, freeze]
    if: >-
      always() && needs.quality.result == 'success' &&
      (needs.freeze.result == 'success' || needs.inspect.outputs.state == 'frozen')
    runs-on: windows-2025-vs2026
    environment: release
    outputs:
      candidate_id: ${{ steps.publish-cargo.outputs.candidate_id }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install fixed Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate formal evidence and inspect exact registry state
        run: ./scripts/release.ps1 -Action CargoStatus -Tag $env:RELEASE_TAG -EvidenceUrl $env:RELEASE_EVIDENCE_URL -EvidenceSha256 $env:RELEASE_EVIDENCE_SHA256 -OutputDirectory artifacts/release-cargo-state
      - name: Strict repeated Cargo archive check before requesting credentials
        run: ./scripts/release.ps1 -Action CargoPreflight -Tag $env:RELEASE_TAG -EvidenceUrl $env:RELEASE_EVIDENCE_URL -EvidenceSha256 $env:RELEASE_EVIDENCE_SHA256 -OutputDirectory artifacts/release-cargo-preflight
      - name: Exchange OIDC identity (also verifies first local bootstrap binding)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6; post revokes token
      - name: Publish once or verify an already published exact version
        id: publish-cargo
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          REGQRY_OIDC_AUTH: 'true'
        run: ./scripts/release.ps1 -Action CargoPublish -Tag $env:RELEASE_TAG -EvidenceUrl $env:RELEASE_EVIDENCE_URL -EvidenceSha256 $env:RELEASE_EVIDENCE_SHA256 -OutputDirectory artifacts/release-cargo-publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-cargo-records
          path: |
            artifacts/release-cargo-state/*.json
            artifacts/release-cargo-preflight/*.json
            artifacts/release-cargo-preflight/*.txt
            artifacts/release-cargo-publish/*.json
            artifacts/release-cargo-publish/*.txt
          if-no-files-found: warn

  registry-install:
    needs: cargo
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
          - runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: 1.100.0-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the candidate accepted by the Cargo job without draft privileges
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-cargo-records
          path: artifacts/cargo-records
      - name: Install pinned native Rust
        run: |
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install exact crates.io version with fresh Cargo home and install root
        env:
          GH_TOKEN: ''
          ACCEPTED_CANDIDATE_ID: ${{ needs.cargo.outputs.candidate_id }}
        run: ./scripts/release.ps1 -Action RegistryInstall -Tag $env:RELEASE_TAG -CandidatePath artifacts/cargo-records/release-cargo-publish/candidate-manifest.json -ExpectedCandidateSha256 $env:ACCEPTED_CANDIDATE_ID -OutputDirectory artifacts/registry-install
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: registry-install-${{ matrix.target }}
          path: |
            artifacts/registry-install/*.json
            artifacts/registry-install/*.txt
          if-no-files-found: warn

  finalize:
    needs: registry-install
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-install-x86_64-pc-windows-msvc
          path: artifacts/registry-installs/x86_64-pc-windows-msvc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registry-install-aarch64-pc-windows-msvc
          path: artifacts/registry-installs/aarch64-pc-windows-msvc
      - name: Install fixed Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive complete original evidence and stage final identities
        run: ./scripts/release.ps1 -Action Finalize -Tag $env:RELEASE_TAG -InputDirectory artifacts/registry-installs -EvidenceUrl $env:RELEASE_EVIDENCE_URL -EvidenceSha256 $env:RELEASE_EVIDENCE_SHA256 -OutputDirectory artifacts/release-finalize
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-finalize
          path: artifacts/release-finalize/**
          if-no-files-found: warn

  publish:
    needs: [inspect, quality, finalize]
    if: >-
      always() && needs.quality.result == 'success' &&
      (needs.finalize.result == 'success' || needs.inspect.outputs.state == 'published')
    runs-on: windows-2025-vs2026
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install fixed Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download/verify every actual asset, then publish the same immutable draft
        run: ./scripts/release.ps1 -Action Publish -Tag $env:RELEASE_TAG -OutputDirectory artifacts/release-publish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-publish
          path: artifacts/release-publish/result.json
          if-no-files-found: warn
