[graph]
targets = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
exclude-dev = false

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
include-dev = true

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
